<title>Voicebank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred working column; the library and the drafts read like
   index cards and manuscript pages. Ink blue on cool paper. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --text: #18202b;
  --muted: #5d6877;
  --line: #d8dee6;
  --accent: #2547a8;
  --accent-text: #ffffff;
  --accent-soft: #e3e9f8;
  --ok: #23774a;
  --warn: #9a5b12;
  --bad: #b3261e;
  --shadow: 0 1px 2px rgb(16 24 40 / 0.05);
  --radius: 8px;
  --font: 'Public Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Literata', 'Iowan Old Style', Georgia, serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #12161c;
    --surface: #1a2029;
    --surface-2: #212833;
    --text: #e6eaf0;
    --muted: #9aa5b4;
    --line: #2f3845;
    --accent: #8fa9f2;
    --accent-text: #0f1626;
    --accent-soft: #23304d;
    --ok: #6fc796;
    --warn: #e3a95c;
    --bad: #f08b82;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #12161c;
  --surface: #1a2029;
  --surface-2: #212833;
  --text: #e6eaf0;
  --muted: #9aa5b4;
  --line: #2f3845;
  --accent: #8fa9f2;
  --accent-text: #0f1626;
  --accent-soft: #23304d;
  --ok: #6fc796;
  --warn: #e3a95c;
  --bad: #f08b82;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--font);
}

a { color: var(--accent); }

h1, h2, h3 { line-height: 1.25; margin: 0 0 0.5rem; text-wrap: balance; }
h1 { font-family: var(--serif); font-size: 1.9rem; font-weight: 600; }
h2 { font-size: 1.05rem; }
h3 { font-size: 0.95rem; margin-top: 1rem; }
p { margin: 0 0 0.75rem; }

body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding-block: 0.6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--text);
  text-decoration: none;
}
.nav { display: flex; gap: 0.25rem; margin-left: auto; }
.nav a {
  padding: 0.35rem 0.7rem;
  border-radius: 999px;
  color: var(--muted);
  text-decoration: none;
  display: inline-flex;
  gap: 0.35rem;
  align-items: center;
}
.nav a:hover { color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-n { font-size: 0.75rem; opacity: 0.75; }

.outlet {
  padding-block: 1.5rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 980px; margin: 0 auto; display: grid; gap: 1rem; }
.page-head p { color: var(--muted); max-width: 62ch; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem;
  box-shadow: var(--shadow);
  display: grid;
  gap: 0.75rem;
  min-width: 0;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.panel > h2 { margin: 0; }

.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.spacer { flex: 1; }
.empty { color: var(--muted); padding: 0.75rem 0; }

.row { display: flex; gap: 0.5rem; align-items: center; min-width: 0; }
.row > input, .row > select { flex: 1; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1 1 12rem; }

.toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.toolbar input[type='search'] { flex: 1 1 14rem; }

input, select, textarea {
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.5rem 0.65rem;
  width: 100%;
}
select { width: auto; max-width: 100%; }
.panel > *, .page > * { min-width: 0; }
textarea { resize: vertical; line-height: 1.55; }
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.field { display: grid; gap: 0.3rem; flex: 1; }
.field-label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
.field select { width: 100%; }

.btn {
  font: inherit;
  font-weight: 500;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  padding: 0.45rem 0.9rem;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  justify-self: start;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { color: var(--text); }
.btn.small { padding: 0.2rem 0.5rem; font-size: 0.82rem; }
.danger:hover:not(:disabled) { color: var(--bad); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn-danger:hover:not(:disabled) { background: var(--bad); filter: brightness(1.08); }

.sync { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

dialog.ask {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  padding: 1.1rem;
  width: min(92vw, 24rem);
  box-shadow: 0 12px 40px rgb(0 0 0 / 0.25);
}
dialog.ask::backdrop { background: rgb(10 14 20 / 0.45); }
.ask-actions { justify-content: flex-end; }

.pill { font-size: 0.8rem; padding: 0.15rem 0.6rem; border-radius: 999px; background: var(--surface-2); }
.pill-ok { color: var(--ok); }
.pill-warn { color: var(--warn); }

/* Voice */
.samples { display: grid; gap: 1rem; }
.sample { display: grid; gap: 0.4rem; padding-bottom: 1rem; border-bottom: 1px dashed var(--line); }

/* Tags */
.tagbar, .tag-pick { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.chip {
  font: inherit;
  font-size: 0.84rem;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: 999px;
  padding: 0.25rem 0.7rem;
  cursor: pointer;
  display: inline-flex;
  gap: 0.35rem;
  align-items: center;
}
.chip:hover { border-color: var(--accent); }
.chip-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip-n { font-size: 0.75rem; color: var(--muted); }
.drop-hover { outline: 2px dashed var(--accent); outline-offset: 2px; background: var(--accent-soft); }
.tag-input { width: 9rem; padding: 0.25rem 0.6rem; border-radius: 999px; font-size: 0.84rem; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 0.2rem;
  font-size: 0.78rem;
  padding: 0.1rem 0.5rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
}
.tag-x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0.1rem; font-size: 0.9rem; line-height: 1; }
.tag-x:hover { color: var(--bad); }

/* Chunk cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.8rem; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--line);
  border-radius: var(--radius);
  padding: 0.8rem 0.9rem;
  display: grid;
  gap: 0.45rem;
  align-content: start;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card[draggable='true'] { cursor: grab; }
.card.dragging, .seq-item.dragging { opacity: 0.4; }
.card h3 { margin: 0; font-size: 1rem; }
.card-text {
  margin: 0;
  color: var(--muted);
  font-size: 0.9rem;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-top { display: flex; gap: 0.5rem; align-items: center; }
.card-top .muted { margin-left: auto; }
.card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.card-actions { display: flex; gap: 0.25rem; align-items: center; }
.card-edit { grid-column: 1 / -1; cursor: default; border-left-color: var(--accent); }
.grip { color: var(--muted); letter-spacing: -2px; font-size: 0.8rem; user-select: none; }
.kind { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: var(--muted); }
.kind-experience { border-left-color: var(--accent); }
.kind-value { border-left-color: var(--ok); }
.kind-intro { border-left-color: var(--warn); }
.kind-closing { border-left-color: var(--muted); }

.split-results { display: grid; gap: 0.6rem; }
.split-item { display: flex; gap: 0.6rem; align-items: start; padding: 0.6rem; border: 1px solid var(--line); border-radius: 8px; }
.split-item input { width: auto; margin-top: 0.3rem; }
.split-item p { margin: 0.25rem 0 0; font-size: 0.9rem; }

/* Match */
.angle { padding: 0.6rem 0.8rem; background: var(--accent-soft); border-radius: 8px; }
.reqs { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.4rem; }
.reqs li { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
.req-chunks { grid-column: 2; display: flex; flex-wrap: wrap; gap: 0.3rem; }
.req-gap .req-text { color: var(--warn); }
.pri { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 0.1rem 0.4rem; border-radius: 4px; align-self: start; margin-top: 0.15rem; }
.pri-must { background: var(--accent-soft); color: var(--accent); }
.pri-nice { background: var(--surface-2); color: var(--muted); }
.gaps { font-size: 0.9rem; }
.gaps ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }

.library { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.3rem; max-height: 22rem; overflow: auto; }
.lib-item { display: flex; gap: 0.6rem; align-items: center; padding: 0.45rem 0.5rem; border: 1px solid var(--line); border-radius: 8px; }
.lib-item[draggable='true'] { cursor: grab; }
.lib-item.in-seq { opacity: 0.55; }
.lib-body { flex: 1; display: grid; min-width: 0; }
.lib-body .small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { width: 3rem; height: 6px; border-radius: 3px; background: var(--surface-2); flex: none; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); }

/* Sequence */
.dropzone { border: 1px dashed var(--line); border-radius: var(--radius); padding: 0.5rem; min-height: 4rem; }
.dropzone .empty { text-align: center; margin: 0; }
.sequence { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
.seq-item {
  display: flex;
  gap: 0.6rem;
  align-items: center;
  padding: 0.5rem 0.6rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: grab;
}
.seq-n {
  width: 1.6rem; height: 1.6rem; flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-text);
  font-size: 0.8rem; font-weight: 700;
}
.seq-body { flex: 1; display: grid; gap: 0.25rem; min-width: 0; }
.purpose { padding: 0.25rem 0.5rem; font-size: 0.85rem; color: var(--muted); }
.seq-actions { display: flex; gap: 0.1rem; flex: none; }

/* Questions */
.questions { display: grid; gap: 1rem; }
.qcard { display: grid; gap: 0.55rem; padding: 0.9rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.q-head { display: flex; gap: 0.5rem; align-items: start; }
.q-prompt { font-weight: 600; resize: none; }
.row > .limit { width: 5.5rem; flex: none; }
.q-opts > select { flex: none; }
.answer { font-family: var(--serif); font-size: 1.02rem; line-height: 1.65; min-height: 12rem; }
.answer.streaming { border-color: var(--accent); }
.count { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.ok { color: var(--ok); }
.count.over { color: var(--bad); font-weight: 600; }

.toasts { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); display: grid; gap: 0.4rem; z-index: 50; width: min(92vw, 28rem); }
.toast { padding: 0.6rem 0.9rem; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 0.9rem; box-shadow: 0 4px 16px rgb(0 0 0 / 0.2); }
.toast-error { background: var(--bad); color: #fff; }

[hidden] { display: none !important; }

@media (max-width: 640px) {
  .outlet { padding-block: 1rem 3rem; }
  .topbar { flex-wrap: wrap; }
  .nav { margin-left: 0; width: 100%; order: 3; }
  .sync { margin-left: auto; }
  h1 { font-size: 1.5rem; }
  .row { flex-wrap: wrap; }
  .seq-item { flex-wrap: wrap; }
  .seq-actions { width: 100%; justify-content: flex-end; }
  .cards { grid-template-columns: 1fr; }
}

</style>
<header class="topbar">
  <a class="brand" href="#assemble">Voicebank</a>
  <nav id="nav" class="nav"></nav>
  <span id="sync" class="sync" hidden></span>
</header>
